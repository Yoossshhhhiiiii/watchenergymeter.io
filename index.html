<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194e45"><title>指針抄錶台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3ee;color:#183a34;font:1rem/1.65 "DM Sans",system-ui,sans-serif}header{border-bottom:1px solid #c9d6cd;padding:16px max(5vw,20px);display:flex;align-items:center;gap:12px;font-weight:700}header i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#194e45;color:white;font-style:normal}main{max-width:1020px;margin:auto;padding:5vh 5vw}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.15;letter-spacing:-.05em;margin:0 0 14px}p{margin:0 0 24px;color:#476358}.drop{background:white;border:2px dashed #799a87;border-radius:18px;padding:36px 15px;text-align:center}.drop.over{background:#d2e9db}button{border:0;border-radius:8px;background:#194e45;color:white;font:inherit;font-weight:700;padding:10px 24px;cursor:pointer}button:disabled{opacity:.55}.drop small{display:block;margin-top:10px;color:#486054}#msg{margin:18px 0;min-height:1.7em}section{background:white;border-radius:16px;padding:20px;margin-top:12px}h2{font-size:1.1rem;margin:0 0 12px}canvas{display:block;max-width:100%;height:auto;border-radius:8px}strong{font:700 clamp(1.8rem,5vw,3rem)/1.4 ui-monospace,monospace;color:#154e40}#read{display:flex;gap:24px;flex-wrap:wrap}#read div{display:grid}#notes{margin:8px 0} [hidden]{display:none!important}
#room{width:6em;border:0;border-bottom:1px solid #8da99b;background:transparent;font:700 2rem ui-monospace,monospace;color:#154e40}</style><header><i aria-hidden="true">↗</i> 指針抄錶台</header><main><h1>從照片讀取電表</h1><p>拍下房號與同一排五個錶盤，讓指針與刻度清楚入鏡。</p><div id="drop" class="drop"><button id="pick">選擇電表照片</button><input id="file" type="file" hidden accept="image/*,.heic,.heif"><small>也可以把照片拖到這裡 · HEIC、JPEG、PNG</small></div><div role="status" id="msg">照片會在你的瀏覽器內處理。</div><section hidden id="result"><h2>本次判讀</h2><div id="read"><div><label for="room">房號（可校正）</label><input id="room" inputmode="numeric" maxlength="8"></div><div>累計度數（kWh）<strong id="value"></strong></div></div><p id="notes"></p><canvas id="detail"></canvas></section><section id="preview" hidden><h2>原始照片</h2><canvas id="photo"></canvas></section></main>
<script defer src="lib/opencv.js"></script><script defer src="lib/heic2any.min.js"></script><script defer src="lib/tesseract.min.js"></script><script defer src="app.js"></script></html>
